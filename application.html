<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>용접 XR — 직선과 원형 용접 데모</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <main id="overlay" class="demo-panel">
    <span class="demo-eyebrow">WELDING XR · INTERACTIVE DEMO</span>
    <h1>용접, 이렇게 만들어집니다.</h1>
    <p class="demo-intro">용접 과정을 보고, 직접 따라 해보세요.</p>
    <div class="demo-tabs demo-modes" role="group" aria-label="웹 체험 방식">
      <button type="button" data-web-mode="demo" aria-pressed="true">시연 보기</button>
      <button type="button" data-web-mode="practice" aria-pressed="false">직접 해보기</button>
    </div>
    <div class="demo-tabs" role="group" aria-label="용접 모양 선택">
      <button type="button" data-demo="plate" aria-pressed="true"><span aria-hidden="true">━</span> 직선 용접</button>
      <button type="button" data-demo="pipe" aria-pressed="false"><span aria-hidden="true">◯</span> 원형 용접</button>
    </div>
    <p id="task" class="hint">작업장을 준비하고 있습니다…</p>
    <div class="demo-actions">
      <button type="button" id="demo-play">▶ 시연 시작</button>
      <button type="button" id="demo-replay">처음부터</button>
    </div>
    <progress id="demo-progress" max="1" value="0" aria-label="용접 시연 진행률"></progress>
    <p id="readout" role="status">잠시만 기다려 주세요.</p>
    <p id="demo-note" class="demo-note">시연 보기 · 원형은 VR과 같은 운봉 순서로 진행합니다.</p>
    <div class="demo-view-controls">
      <button type="button" id="demo-view-reset" title="F키로도 시점을 복귀할 수 있습니다">시점 복귀 <kbd>F</kbd></button>
      <p id="demo-view-help">마우스 드래그로 회전 · 휠로 확대<br>방향키 / WASD 이동 · Q/E 높이 조절</p>
    </div>
  </main>
  <div id="result"></div>
  <div id="booterror"></div>
  <script type="module" src="./shop.js"></script>
  <script>
    setTimeout(function () {
      if (document.querySelector('canvas')) return;
      var el = document.getElementById('booterror');
      el.textContent = '3D 작업장을 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
      el.style.display = 'block';
    }, 5000);
  </script>
</body>
</html>
